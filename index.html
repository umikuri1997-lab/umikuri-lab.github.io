<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:title" content="うみくりのゲームばこ">

<meta property="og:type" content="website">
<meta property="og:image" content="https://umikuri1997-lab.github.io/umikuri-lab.github.io/img/hakoniwa.webp">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+2:wght@500;700;800&family=Rubik:wght@700;800;900&display=swap" rel="stylesheet">

<style>
/* インディーゲームのスタジオふう：あざやかな色の帯・太い字・シール・くっきりした黒いふちとかげ */
:root{
  --cream:#fff4e2; --ink:#1f1b2e; --tomato:#ff5a36; --sun:#ffc83d; --mint:#2fd1a0; --sky:#4f9dff; --lilac:#b79cff; --pink:#ff8fb3;
  --disp:"Dela Gothic One","M PLUS 2",sans-serif;
  --body:"M PLUS 2","Hiragino Sans",system-ui,sans-serif;
  --en:"Rubik","M PLUS 2",sans-serif;
  --bounce:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,1,.36,1);
  --pad:clamp(16px,5vw,64px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-weight:500;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
img{display:block;max-width:100%;height:auto}

/* くっきりボタン：黒いふち＋ずらしたかげ。おすと、かげの上にしずむ */
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border:3px solid var(--ink);border-radius:999px;background:var(--sun);font-family:var(--disp);font-size:18px;letter-spacing:.04em;text-decoration:none;color:var(--ink);box-shadow:5px 5px 0 var(--ink);transition:transform .15s var(--ease),box-shadow .15s var(--ease);cursor:pointer}
.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.btn:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink)}
.btn.red{background:var(--tomato);color:#fff}
.btn.white{background:#fff}
.btn:focus-visible{outline:3px dashed var(--ink);outline-offset:5px}
.btn svg{width:18px;height:18px}

/* 上の帯 */
.nav{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:14px var(--pad);pointer-events:none}
.nav>*{pointer-events:auto}
.logo{display:inline-flex;align-items:center;gap:10px;padding:8px 18px 8px 10px;background:#fff;border:3px solid var(--ink);border-radius:999px;box-shadow:3px 3px 0 var(--ink);font-family:var(--en);font-weight:900;font-size:15px;letter-spacing:.06em;text-decoration:none}
.logo i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--tomato);border:2px solid var(--ink)}
.logo i svg{width:16px;height:16px;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.snd{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:#fff;border:3px solid var(--ink);border-radius:999px;box-shadow:3px 3px 0 var(--ink);font-family:var(--en);font-weight:800;font-size:13px;letter-spacing:.08em;cursor:pointer;transition:transform .12s,box-shadow .12s}
.snd:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.snd[aria-pressed="true"]{background:var(--mint)}
.snd svg{width:18px;height:18px}
.snd .on{display:none}.snd[aria-pressed="true"] .on{display:block}.snd[aria-pressed="true"] .off{display:none}
.logo:focus-visible,.snd:focus-visible{outline:3px dashed var(--ink);outline-offset:4px}

/* ヒーロー */
.hero{position:relative;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:center;gap:2vw;padding:100px var(--pad) 90px;overflow:hidden}
.hero .bg{position:absolute;inset:0;z-index:-1;background:
  radial-gradient(circle at 12% 18%,rgba(255,200,61,.35) 0 120px,transparent 121px),
  radial-gradient(circle at 92% 88%,rgba(79,157,255,.22) 0 160px,transparent 161px),
  radial-gradient(circle,rgba(31,27,46,.09) 1.5px,transparent 2px) 0 0/22px 22px,var(--cream)}
.hero .tag{display:inline-flex;align-items:center;gap:8px;margin:0 0 22px;padding:6px 14px;background:var(--mint);border:3px solid var(--ink);border-radius:999px;font-family:var(--en);font-weight:800;font-size:13px;letter-spacing:.08em;transform:rotate(-2deg)}
.hero .tag b{width:9px;height:9px;border-radius:50%;background:var(--ink);animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.hero h1{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(44px,7vw,104px);line-height:1.08;letter-spacing:.01em}
.hero h1 .l{display:block}
.hero h1 .c{display:inline-block;cursor:pointer;transition:transform .3s var(--bounce)}
.hero h1 .c:hover{transform:translateY(-8px) rotate(-6deg)}
.hero h1 .c.hop{animation:hop .6s var(--bounce)}
@keyframes hop{0%{transform:none}35%{transform:translateY(-22px) scale(1.12,.9) rotate(-8deg)}70%{transform:translateY(3px) scale(.95,1.05)}100%{transform:none}}
.hero h1 .hl{color:var(--tomato);-webkit-text-stroke:0;text-shadow:4px 4px 0 var(--ink)}
.hero .lead{margin:24px 0 32px;font-size:clamp(15px,1.4vw,18px);max-width:28em}
.hero .cta{display:flex;gap:16px;flex-wrap:wrap}
.stage{position:relative;height:min(76svh,700px);min-height:360px}
.disc{position:absolute;left:50%;top:50%;width:min(88%,560px);aspect-ratio:1;transform:translate(-50%,-46%);border-radius:50%;background:var(--sun);border:4px solid var(--ink);box-shadow:10px 10px 0 var(--ink)}
.disc::after{content:"";position:absolute;inset:18px;border-radius:50%;border:3px dashed rgba(31,27,46,.35);animation:spin 40s linear infinite}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;opacity:0;transition:opacity 1s var(--ease)}
.ready #cv{opacity:1}
.loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--disp);font-size:16px;transition:opacity .4s}
.ready .loading{opacity:0}
/* シール */
.stk{position:absolute;z-index:3;pointer-events:none}
.stk.round{right:2%;top:6%;width:128px;height:128px;animation:spin 14s linear infinite}
.stk.round text{font-family:var(--en);font-weight:900;font-size:13px;letter-spacing:2.6px}
.stk.star{left:4%;bottom:12%;width:110px;height:110px;transform:rotate(-12deg);animation:wob 3s ease-in-out infinite}
.stk.star span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:17px;line-height:1.1;text-align:center;color:var(--ink)}
@keyframes wob{50%{transform:rotate(-4deg) scale(1.05)}}
.stage .hint{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);margin:0;padding:4px 14px;background:#fff;border:2px solid var(--ink);border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}

/* 流れる帯 */
.marq-wrap{overflow:hidden;margin:-56px 0 -26px;padding:26px 0;position:relative;z-index:4}
.marq{background:var(--ink);color:var(--cream);overflow:hidden;border-block:3px solid var(--ink);transform:rotate(-1.5deg);margin:0 -20px}
.marq .row{display:flex;width:max-content;animation:marq 26s linear infinite}
.marq span{display:inline-flex;align-items:center;gap:22px;padding:14px 22px;font-family:var(--disp);font-size:clamp(18px,2.4vw,28px);white-space:nowrap}
.marq span i{display:inline-block;width:22px;height:22px;background:var(--sun);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.marq span:nth-child(3n+2) i{background:var(--mint)}.marq span:nth-child(3n) i{background:var(--pink)}
@keyframes marq{to{transform:translateX(-50%)}}

/* 色の帯のセクション */
.band{position:relative;padding:110px var(--pad) 120px}
.band.mint{background:var(--mint)}
.band.lilac{background:var(--lilac)}
.wave{position:absolute;left:0;right:0;top:-1px;height:40px;display:block;width:100%}
.band h2{margin:0 0 10px;font-family:var(--disp);font-weight:400;font-size:clamp(34px,5vw,64px);line-height:1.1}
.band .sub{margin:0 0 50px;font-weight:700;font-size:17px}
.kicker{display:inline-block;margin:0 0 14px;padding:4px 12px;background:var(--ink);color:var(--cream);font-family:var(--en);font-weight:800;font-size:13px;letter-spacing:.12em;border-radius:6px;transform:rotate(-2deg)}

/* ゲームのカード */
.game{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center;background:var(--cream);border:4px solid var(--ink);border-radius:28px;padding:clamp(16px,2.4vw,28px);box-shadow:12px 12px 0 var(--ink)}
.shot{position:relative;border:4px solid var(--ink);border-radius:18px;overflow:hidden;cursor:pointer;padding:0;background:var(--ink);transform:rotate(-1.5deg);transition:transform .4s var(--bounce)}
.shot:hover{transform:rotate(0) scale(1.02)}
.shot img{width:100%;aspect-ratio:16/10;object-fit:cover;transition:opacity .6s}
.shot .play-ic{position:absolute;right:16px;bottom:16px;width:64px;height:64px;border-radius:50%;background:var(--tomato);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);display:grid;place-items:center}
.shot .play-ic svg{width:26px;height:26px;margin-left:4px}
.shot:focus-visible{outline:3px dashed var(--ink);outline-offset:6px}
.game .no{font-family:var(--en);font-weight:900;font-size:15px;letter-spacing:.14em;color:var(--tomato)}
.game h3{margin:6px 0 4px;font-family:var(--disp);font-weight:400;font-size:clamp(30px,3.4vw,46px);line-height:1.15}
.game .catch{margin:0 0 16px;font-weight:800;color:#5a4f6e}
.game .desc{margin:0 0 18px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px;padding:0;list-style:none}
.pills li{padding:4px 14px;border:2px solid var(--ink);border-radius:999px;font-weight:800;font-size:13px;background:#fff}
.pills li:nth-child(1){background:var(--sun)}.pills li:nth-child(2){background:var(--sky);color:#fff}.pills li:nth-child(3){background:var(--pink)}
.game .cta{display:flex;gap:14px;flex-wrap:wrap}
/* 画面のならび（ながれる） */
.strip{margin-top:44px;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.strip .row{display:flex;gap:18px;width:max-content;animation:marq 40s linear infinite}
.strip img{width:clamp(220px,26vw,340px);aspect-ratio:16/10;object-fit:cover;border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink)}
.strip .row img:nth-child(odd){transform:rotate(-1.5deg)}.strip .row img:nth-child(even){transform:rotate(1.5deg)}
.strip:hover .row{animation-play-state:paused}

/* つぎのゲーム */
.soon{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;margin-top:56px;background:#fff;border:4px dashed var(--ink);border-radius:28px;padding:28px}
.soon .q{width:110px;height:110px;border-radius:24px;background:var(--lilac);border:4px solid var(--ink);display:grid;place-items:center;font-family:var(--disp);font-size:56px;box-shadow:6px 6px 0 var(--ink);animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
.soon h3{margin:0;font-family:var(--disp);font-weight:400;font-size:26px}
.soon p{margin:4px 0 0;font-weight:700}

footer{background:var(--ink);color:var(--cream);padding:56px var(--pad) 40px;display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}
footer .big{font-family:var(--disp);font-size:clamp(26px,3.6vw,44px);line-height:1.15;margin:0}
footer .big span{color:var(--sun)}
footer small{font-family:var(--en);font-weight:700;letter-spacing:.1em;opacity:.7}

/* ふわっと出す */
.rv{opacity:0;transform:translateY(40px) scale(.98);transition:opacity .8s var(--ease),transform .8s var(--bounce)}
.rv.in{opacity:1;transform:none}

/* ふきだし */
.bubble{position:fixed;z-index:40;transform:translate(-50%,-100%) scale(.5);opacity:0;white-space:nowrap;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);padding:6px 14px;font-family:var(--disp);font-size:15px;transition:opacity .2s,transform .35s var(--bounce);pointer-events:none}
.bubble.on{opacity:1;transform:translate(-50%,calc(-100% - 8px)) scale(1)}

/* 紹介 */
dialog{border:0;padding:0;background:none;width:min(960px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:visible}
dialog::backdrop{background:rgba(31,27,46,.6);backdrop-filter:blur(3px)}
dialog[open] .pop{animation:pop .55s var(--bounce)}
@keyframes pop{from{opacity:0;transform:scale(.8) rotate(-3deg)}to{opacity:1;transform:none}}
.pop{position:relative;background:var(--cream);border:4px solid var(--ink);border-radius:26px;box-shadow:12px 12px 0 var(--ink);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);overflow:hidden;max-height:calc(100svh - 40px);overflow-y:auto}
.gal{background:var(--ink);padding:14px;display:flex;flex-direction:column;gap:10px}
.gal .fr{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;border:3px solid var(--cream)}
.gal .fr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.gal .fr img.on{opacity:1}
.thumbs{display:flex;gap:8px}
.thumbs button{flex:1;padding:0;border:3px solid transparent;border-radius:8px;overflow:hidden;background:none;cursor:pointer;opacity:.55;transition:opacity .2s,transform .2s var(--bounce)}
.thumbs button img{aspect-ratio:16/10;object-fit:cover;width:100%}
.thumbs button[aria-current="true"]{opacity:1;border-color:var(--sun);transform:translateY(-3px)}
.pop .bd{padding:30px 26px}
.pop .no{font-family:var(--en);font-weight:900;letter-spacing:.14em;color:var(--tomato);font-size:14px}
.pop h2{margin:4px 0 2px;font-family:var(--disp);font-weight:400;font-size:32px;line-height:1.2}
.pop .catch{margin:0 0 14px;font-weight:800;color:#5a4f6e}
.pop .desc{margin:0 0 16px;font-size:15px}
.pop .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.pop .x{position:absolute;top:12px;right:12px;z-index:2;width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);cursor:pointer;font-family:var(--disp);font-size:20px;line-height:1}
.pop .x:active{transform:translate(3px,3px);box-shadow:none}
.pop .x:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}

@media (max-width:860px){
  .logo{font-size:12px;padding:6px 12px 6px 6px}.logo i{width:24px;height:24px}
  .snd{padding:8px 10px}.snd span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .hero{grid-template-columns:1fr;padding-top:92px;padding-bottom:70px;gap:10px;min-height:auto}
  .stage{height:62svh;min-height:330px}
  .stk.round{width:96px;height:96px;right:0;top:0}
  .stk.star{width:86px;height:86px;left:0;bottom:8%}
  .stk.star span{font-size:13px}
  .game,.pop{grid-template-columns:1fr}
  .game{box-shadow:7px 7px 0 var(--ink)}
  .soon{grid-template-columns:1fr;justify-items:start}
  .band{padding:90px var(--pad) 100px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  .rv{opacity:1;transform:none}
}
</style>
</head>
<body>

<header class="nav">
  <a class="logo" href="#top"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z" fill="#fff"/></svg></i>UMIKURI GAMES</a>
  <button class="snd" id="snd" aria-pressed="false"><svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg><svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg><span id="sndT">SOUND OFF</span></button>
</header>

<main id="top">
  <section class="hero" id="hero">
    <div class="bg" aria-hidden="true"></div>
    <div>
      <p class="tag"><b aria-hidden="true"></b>NOW PLAYING — ブラウザで遊べる</p>
      <h1 id="ttl" aria-label="うみくりのゲームばこ"></h1>
      <p class="lead">うみくりが作ったゲームを、この箱につめこみました。ダウンロードなしで、すぐに遊べます。箱をあけて、のぞいてみて！</p>
      <div class="cta">
        <a class="btn red" href="#games">ゲームをみる<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg></a>
      </div>
    </div>
    <div class="stage">
      <div class="disc" aria-hidden="true"></div>
      <canvas id="cv" aria-label="木のおもちゃ箱。ふたをおすと、あけしめできる。中のゲームをおすと紹介が出る"></canvas>
      <p class="loading" id="loading">はこんでいます…</p>
      <svg class="stk round" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="56" fill="#ff8fb3" stroke="#1f1b2e" stroke-width="4"/><path id="cp" d="M60 60m-40 0a40 40 0 1 1 80 0a40 40 0 1 1-80 0" fill="none"/><text fill="#1f1b2e"><textPath href="#cp">PLAY FREE ★ PLAY FREE ★ PLAY FREE ★</textPath></text><circle cx="60" cy="60" r="14" fill="#ffc83d" stroke="#1f1b2e" stroke-width="3"/></svg>
      <div class="stk star" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 1.5l2.6 3.4 4.2-.9.4 4.3 3.7 2.2-2.6 3.4 1.2 4.1-4.2.9-1.9 3.9-3.4-2.6-3.4 2.6-1.9-3.9-4.2-.9 1.2-4.1L.8 10.5l3.7-2.2.4-4.3 4.2.9z" fill="#2fd1a0" stroke="#1f1b2e" stroke-width=".9" stroke-linejoin="round"/></svg><span>さわって<br>みて！</span></div>
      <p class="hint">箱をタップ・クリック</p>
    </div>
  </section>

  <div class="marq-wrap" aria-hidden="true"><div class="marq"><div class="row" id="marq"></div></div></div>

  <section class="band mint" id="games">
    <svg class="wave" viewBox="0 0 1440 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0h1440v14c-120 22-240 22-360 0s-240-22-360 0-240 22-360 0-240-22-360 0z" fill="#fff4e2"/></svg>
    <p class="kicker">GAMES</p>
    <h2 class="rv">ゲームのいちらん</h2>
    <p class="sub rv">どれも、スマホでもパソコンでも、ブラウザですぐ遊べます。</p>
    <!-- ゲームを足すときは、GAMES（下のプログラム）に1つ足す。絵は img/ に入れる -->
    <div id="list"></div>
    <div class="soon rv"><div class="q" aria-hidden="true">?</div><div><h3>つぎのゲーム、つくってます</h3><p>できたら、この箱に入れます。おたのしみに！</p></div></div>
  </section>
</main>

<footer>
  <p class="big">あそんでくれて、<br><span>ありがとう！</span></p>
  <small>© 2026 UMIKURI GAMES</small>
</footer>

<div class="bubble" id="bubble" aria-live="polite"></div>

<dialog id="dlg" aria-labelledby="dName">
  <div class="pop">
    <button class="x" id="dlgX" aria-label="とじる">×</button>
    <div class="gal"><div class="fr" id="gal"></div><div class="thumbs" id="thumbs"></div></div>
    <div class="bd">
      <p class="no" id="dNo"></p>
      <h2 id="dName"></h2>
      <p class="catch" id="dCatch"></p>
      <p class="desc" id="dDesc"></p>
      <ul class="pills" id="dPills"></ul>
      <div class="cta"><a class="btn red" id="dPlay" href="#">あそぶ！</a><a class="btn white" id="dMore" href="#">しょうかい</a></div>
    </div>
  </div>
</dialog>

<script type="module">
import {startScene} from './js/scene.js';
/* ゲームの一覧。ふやすときは、ここに1つ足す（shots ははじめの1まいがパッケージの絵） */
const GAMES=[
  {name:'はこにわ暮らし',catch:'守り神とせいれいのものがたり',pills:['村づくり','スマホ・パソコン','無料'],
   shots:['img/hakoniwa.webp','img/hakoniwa-kazan.webp','img/hakoniwa-tani.webp','img/hakoniwa-mizube.webp','img/hakoniwa-sora.webp'],
   alt:'はこにわ暮らしの画面',
   desc:'荒れた土地をまもる守り神になって、ちいさなせいれいたちと村をつくる。夜はこわいものから村を守りながら、土地ごとのお話をすすめよう。',
   play:'https://umikuri1997-lab.github.io/Hakoniwa/index.html',more:'https://umikuri1997-lab.github.io/Hakoniwa/about.html'},
];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const no=i=>'GAME '+String(i+1).padStart(2,'0');

/* 音：その場で作る。はじめは消しておく */
let AC=null,SND=false;try{SND=localStorage.getItem('gamebako-snd')==='1'}catch(e){}
const sndBtn=document.getElementById('snd'),sndT=document.getElementById('sndT');
const sndUI=()=>{sndBtn.setAttribute('aria-pressed',SND);sndT.textContent=SND?'SOUND ON':'SOUND OFF'};sndUI();
function note(f,dur,{type='sine',vol=.14,when=0,to=null}={}){if(!SND)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.05)}catch(e){}}
const S={open:()=>[523,659,784,1047].forEach((f,i)=>note(f,.18,{type:'square',vol:.05,when:i*.08})),close:()=>note(330,.15,{type:'square',vol:.05,to:200}),
  pop:()=>note(440,.14,{type:'square',vol:.05,to:1320}),shake:()=>{for(let i=0;i<3;i++)note(300-i*30,.07,{type:'square',vol:.04,when:i*.08})},boing:()=>note(200,.25,{vol:.16,to:700}),tap:()=>note(988,.08,{type:'square',vol:.04})};
const sfx=k=>S[k]&&S[k]();
sndBtn.onclick=()=>{SND=!SND;sndUI();try{localStorage.setItem('gamebako-snd',SND?'1':'0')}catch(e){}if(SND)S.tap()};

/* タイトル：1文字ずつ、さわるとはねる */
{const ttl=document.getElementById('ttl'),N=[523,587,659,698,784,880,988,1047,1175,1319];let k=0;
 [['うみくりの',''],['ゲームばこ','hl']].forEach(([w,cls])=>{const l=document.createElement('span');l.className='l '+cls;
   for(const ch of w){const s=document.createElement('span');s.className='c';s.textContent=ch;s.setAttribute('aria-hidden','true');const f=N[k++];
     s.addEventListener('click',()=>{s.classList.remove('hop');void s.offsetWidth;s.classList.add('hop');note(f,.12,{type:'square',vol:.05})});l.appendChild(s)}
   ttl.appendChild(l)})}

/* 流れる帯 */
{const W=['はこにわ暮らし','PLAY IN YOUR BROWSER','すぐ遊べる','FREE TO PLAY','つぎのゲームも、つくってます'],m=document.getElementById('marq');
 m.innerHTML=[...W,...W,...W,...W].map(w=>`<span><i></i>${w}</span>`).join('')}

/* 紹介 */
const dlg=document.getElementById('dlg');let galT=null;
const pills=(ul,g)=>{ul.innerHTML='';for(const p of g.pills){const li=document.createElement('li');li.textContent=p;ul.appendChild(li)}};
function openGame(g){const i=GAMES.indexOf(g),gal=document.getElementById('gal'),th=document.getElementById('thumbs');gal.innerHTML='';th.innerHTML='';
  const ims=g.shots.map((src,k)=>{const im=new Image();im.src=src;im.alt=k?'':g.alt;im.width=1280;im.height=720;gal.appendChild(im);
    const b=document.createElement('button');b.setAttribute('aria-label',(k+1)+'まいめ');b.innerHTML=`<img src="${src}" alt="" width="1280" height="720">`;b.onclick=()=>show(k,true);th.appendChild(b);return im});
  let cur=0;function show(k,user){ims[cur].classList.remove('on');th.children[cur].removeAttribute('aria-current');cur=k;ims[cur].classList.add('on');th.children[cur].setAttribute('aria-current','true');if(user){S.tap();clearInterval(galT)}}
  show(0);clearInterval(galT);if(!reduce&&ims.length>1)galT=setInterval(()=>show((cur+1)%ims.length),2800);
  document.getElementById('dNo').textContent=no(i);document.getElementById('dName').textContent=g.name;document.getElementById('dCatch').textContent=g.catch;document.getElementById('dDesc').textContent=g.desc;
  pills(document.getElementById('dPills'),g);
  document.getElementById('dPlay').href=g.play;const m=document.getElementById('dMore');if(g.more){m.href=g.more;m.hidden=false}else m.hidden=true;dlg.showModal()}
dlg.addEventListener('close',()=>clearInterval(galT));
document.getElementById('dlgX').onclick=()=>{S.tap();dlg.close()};
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});

/* ふきだし */
const bub=document.getElementById('bubble');let bubT=null;
function say(text,x,y){bub.textContent=text;bub.style.left=x+'px';bub.style.top=y+'px';bub.classList.add('on');clearTimeout(bubT);bubT=setTimeout(()=>bub.classList.remove('on'),1800)}

/* ゲームのカード */
{const L=document.getElementById('list');
 GAMES.forEach((g,i)=>{const a=document.createElement('article');a.className='rv';
   a.innerHTML=`<div class="game"><button class="shot"><img src="${g.shots[0]}" alt="" width="1280" height="720" loading="lazy"><span class="play-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="#fff" stroke="#1f1b2e" stroke-width="2" stroke-linejoin="round"/></svg></span></button>
     <div><span class="no"></span><h3></h3><p class="catch"></p><p class="desc"></p><ul class="pills"></ul><div class="cta"><a class="btn red">あそぶ！</a><a class="btn white">しょうかい</a></div></div></div>
     <div class="strip" aria-hidden="true"><div class="row"></div></div>`;
   const sh=a.querySelector('.shot');sh.setAttribute('aria-label',g.name+'の紹介をひらく');sh.querySelector('img').alt=g.alt;sh.onclick=()=>{S.pop();openGame(g)};
   a.querySelector('.no').textContent=no(i);a.querySelector('h3').textContent=g.name;a.querySelector('.catch').textContent=g.catch;a.querySelector('.desc').textContent=g.desc;pills(a.querySelector('.pills'),g);
   const bs=a.querySelectorAll('.cta .btn');bs[0].href=g.play;if(g.more)bs[1].href=g.more;else bs[1].remove();
   a.querySelector('.strip .row').innerHTML=[...g.shots,...g.shots].map(s=>`<img src="${s}" alt="" width="1280" height="720" loading="lazy">`).join('');
   L.appendChild(a)})}

/* スクロールで、ぽんと出す */
{const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll('.rv').forEach(el=>io.observe(el))}

/* 3Dの箱 */
const hero=document.getElementById('hero');
startScene({canvas:document.getElementById('cv'),games:GAMES,onGame:openGame,onSay:say,sfx,reduce})
  .then(()=>hero.classList.add('ready'))
  .catch(e=>{console.error(e);document.getElementById('loading').textContent='3Dの箱をひらけませんでした。下のいちらんから遊べます。'});
</script>
</body>
</html>
