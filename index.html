<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>うみくりのゲームばこ</title>
<meta name="description" content="うみくりが作ったゲームをつめこんだ、おもちゃ箱。ブラウザですぐ遊べます。">
<meta property="og:title" content="うみくりのゲームばこ">
<meta property="og:description" content="うみくりが作ったゲームをつめこんだ、おもちゃ箱。ブラウザですぐ遊べます。">
<meta property="og:type" content="website">
<meta property="og:image" content="https://umikuri1997-lab.github.io/umikuri-lab.github.io/img/hakoniwa.webp">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js","three/addons/":"./vendor/three/addons/"}}</script>
<style>
/* 上：3Dの部屋（js/scene.js）。下：ゲームのいちらん */
:root{
  --ink:#4b3523; --muted:#7c6249; --cream:#fff8ea; --paper:#fbf3e3;
  --red:#d9604f; --yellow:#efc35a;
  --spring:cubic-bezier(.34,1.56,.64,1); --soft:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:500;line-height:1.75;-webkit-font-smoothing:antialiased;background:var(--paper)}
button{font:inherit;color:inherit}
img{display:block;max-width:100%;height:auto}

.hero{position:relative;height:max(100svh,620px);overflow:hidden;background:#ead3a8}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;opacity:0;transition:opacity .9s ease}
.ready #cv{opacity:1}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(80,45,15,.32) 100%)}

.title{position:absolute;left:0;right:0;top:0;z-index:3;text-align:center;padding:clamp(18px,5vh,48px) 16px 0;pointer-events:none}
.title h1{margin:0;font-weight:900;font-size:clamp(30px,6.4vw,62px);letter-spacing:.06em;line-height:1.15;color:#6a4322;
  -webkit-text-stroke:9px var(--cream);paint-order:stroke fill;text-shadow:0 6px 0 rgba(120,75,35,.22),0 14px 28px rgba(120,75,35,.2)}
.title h1 span{display:inline-block;pointer-events:auto;cursor:pointer;transition:transform .35s var(--spring)}
.title h1 span:hover{transform:translateY(-6px) rotate(-4deg)}
.title h1 span.hop{animation:hop .55s var(--spring)}
.title h1 .ac{color:var(--red)}
@keyframes hop{0%{transform:none}35%{transform:translateY(-18px) scale(1.1,.92)}70%{transform:translateY(2px) scale(.96,1.04)}100%{transform:none}}
.title p{margin:6px 0 0;font-family:"Klee One",serif;font-weight:600;font-size:clamp(14px,2.2vw,18px);color:#7c6249;text-shadow:0 1px 0 rgba(255,248,234,.8)}

.loading{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);z-index:2;font-family:"Klee One",serif;color:#7c6249;text-align:center;transition:opacity .4s}
.loading::before{content:"";display:block;width:34px;height:34px;margin:0 auto 10px;border-radius:50%;border:4px solid rgba(124,98,73,.25);border-top-color:#7c6249;animation:spin 1s linear infinite}
.loading.err::before{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.ready .loading{opacity:0;pointer-events:none}
.scroll{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:3;font-family:"Klee One",serif;font-size:14px;color:var(--cream);text-shadow:0 1px 3px rgba(60,30,10,.6);text-decoration:none;opacity:.9}
.scroll::after{content:"";display:block;width:12px;height:12px;margin:2px auto 0;border-right:3px solid currentColor;border-bottom:3px solid currentColor;transform:rotate(45deg);animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(5px) rotate(45deg)}}

/* 吹き出し（プレゼント） */
.bubble{position:fixed;z-index:20;transform:translate(-50%,-100%) scale(.5);opacity:0;white-space:nowrap;background:var(--cream);border-radius:20px;padding:6px 16px;font-family:"Klee One",serif;font-size:17px;box-shadow:0 4px 0 rgba(120,75,35,.25),0 8px 18px rgba(60,30,10,.2);transition:transform .35s var(--spring),opacity .2s;pointer-events:none}
.bubble::after{content:"";position:absolute;left:50%;top:100%;margin-left:-8px;border:8px solid transparent;border-top-color:var(--cream)}
.bubble.on{opacity:1;transform:translate(-50%,-100%) scale(1)}

/* 音のボタン */
.snd{position:fixed;top:14px;right:14px;z-index:30;width:50px;height:50px;border-radius:50%;border:0;background:var(--cream);box-shadow:0 4px 0 #d8bf95,0 8px 16px rgba(120,75,35,.2);cursor:pointer;display:grid;place-items:center;transition:transform .12s var(--soft)}
.snd:active{transform:translateY(3px)}
.snd:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.snd svg{width:26px;height:26px}
.snd .on{display:none}.snd[aria-pressed="true"] .on{display:block}.snd[aria-pressed="true"] .off{display:none}

/* いちらん */
.book{padding:56px 16px 40px}
.book h2{text-align:center;margin:0 0 26px;font-family:"Klee One",serif;font-size:26px;color:#6a4322}
.book h2::before,.book h2::after{content:"";display:inline-block;width:40px;height:2px;background:#c9a46e;vertical-align:middle;margin:0 14px}
.list{max-width:880px;margin:0 auto;display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));list-style:none;padding:0}
.card{background:#fffdf7;border-radius:12px;overflow:hidden;box-shadow:0 1px 0 #ead9b8,0 10px 26px rgba(120,75,35,.13);transition:transform .3s var(--soft),box-shadow .3s}
.card:hover{transform:translateY(-4px);box-shadow:0 1px 0 #ead9b8,0 18px 32px rgba(120,75,35,.18)}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover}
.card .bd{padding:14px 18px 18px}
.card h3{margin:0;font-size:21px;font-weight:900}
.card .tg{margin:0 0 6px;font-family:"Klee One",serif;color:var(--muted);font-size:14px}
.card p{margin:0 0 14px;font-size:15px}
.soon{display:grid;place-items:center;min-height:200px;border:2px dashed #dcc59c;border-radius:12px;color:var(--muted);font-family:"Klee One",serif;font-size:17px;text-align:center;padding:20px}
footer{color:var(--muted);text-align:center;font-size:13px;padding:10px 16px 26px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:10px 26px;border-radius:40px;font-weight:900;font-size:16px;letter-spacing:.1em;text-decoration:none;transition:transform .12s var(--soft),box-shadow .12s}
.btn.play{background:var(--red);color:#fff;box-shadow:0 5px 0 #a8443a,0 8px 14px rgba(168,68,58,.3)}
.btn.more{background:#fff4df;color:#6a4322;box-shadow:0 5px 0 #d8bf95}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(4px)}
.btn:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

/* ゲームの紹介（ポップアップ） */
dialog{border:0;padding:0;background:none;max-width:min(620px,calc(100% - 32px));width:100%;overflow:visible}
dialog::backdrop{background:rgba(60,35,15,.5);backdrop-filter:blur(3px)}
dialog[open] .pop{animation:popin .5s var(--spring)}
@keyframes popin{0%{transform:scale(.75) translateY(40px) rotate(-2deg);opacity:0}100%{transform:none;opacity:1}}
.pop{background:#fffdf7;border-radius:16px;box-shadow:0 20px 50px rgba(40,20,5,.4);position:relative;overflow:hidden}
.gal{position:relative;aspect-ratio:16/9;background:#e9d7b5}
.gal img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease}
.gal img.on{opacity:1}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:8px}
.dots button{width:12px;height:12px;border-radius:50%;border:2px solid #fff;background:rgba(255,255,255,.35);padding:0;cursor:pointer}
.dots button[aria-current="true"]{background:#fff}
.pop .bd{padding:16px 22px 22px}
.pop h2{margin:0;font-size:26px;font-weight:900}
.pop .tg{margin:0 0 8px;color:var(--muted);font-family:"Klee One",serif;font-size:15px}
.pop .ds{margin:0 0 18px}
.pop .x{position:absolute;top:10px;right:10px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,250,240,.92);cursor:pointer;font-size:22px;font-weight:900;line-height:1;box-shadow:0 3px 8px rgba(0,0,0,.2);z-index:2}
.pop .x:focus-visible{outline:3px solid var(--yellow)}

@media (max-width:640px){.title{padding-top:74px}.title h1{font-size:8vw;letter-spacing:0;-webkit-text-stroke:7px var(--cream)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<button class="snd" id="snd" aria-pressed="false" aria-label="音">
  <svg class="off" viewBox="0 0 24 24" fill="none" stroke="#6a4322" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>
  <svg class="on" viewBox="0 0 24 24" fill="none" stroke="#6a4322" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
</button>

<section class="hero" id="hero" aria-label="おもちゃ箱">
  <canvas id="cv" aria-label="木のおもちゃ箱。ふたをおすと、あけしめできる。中のゲームをおすと紹介が出る"></canvas>
  <div class="loading" id="loading">おもちゃ箱をはこんでいます</div>
  <header class="title">
    <h1 id="ttl" aria-label="うみくりのゲームばこ"></h1>
    <p>ふたをあけて、すきなゲームをえらんでね</p>
  </header>
  <a class="scroll" href="#list">ゲームのいちらん</a>
</section>

<section class="book">
  <h2>ゲームのいちらん</h2>
  <!-- ゲームを足すときは、GAMES（下のプログラム）に1つ足す。絵は img/ に入れる -->
  <ul class="list" id="list"></ul>
</section>
<footer>うみくりのゲームばこ</footer>

<div class="bubble" id="bubble" aria-live="polite"></div>

<dialog id="dlg" aria-labelledby="dName">
  <div class="pop">
    <button class="x" id="dlgX" aria-label="とじる">×</button>
    <div class="gal" id="gal"><div class="dots" id="dots"></div></div>
    <div class="bd">
      <h2 id="dName"></h2>
      <p class="tg" id="dTag"></p>
      <p class="ds" id="dDesc"></p>
      <div class="btns"><a class="btn play" id="dPlay" href="#">あそぶ</a><a class="btn more" id="dMore" href="#">しょうかい</a></div>
    </div>
  </div>
</dialog>

<script type="module">
import {startScene} from './js/scene.js';
/* ゲームの一覧。ふやすときは、ここに1つ足す（shots は紹介で切りかわる絵。はじめの1まいがパッケージの絵） */
const GAMES=[
  {name:'はこにわ暮らし',catch:'守り神とせいれいのものがたり',tag:'村づくり・スマホ／パソコン',
   shots:['img/hakoniwa.webp','img/hakoniwa-kazan.webp','img/hakoniwa-tani.webp','img/hakoniwa-mizube.webp','img/hakoniwa-sora.webp'],
   alt:'はこにわ暮らしの画面',
   desc:'荒れた土地をまもる守り神になって、ちいさなせいれいたちと村をつくる。夜はこわいものから村を守りながら、土地ごとのお話をすすめよう。',
   play:'https://umikuri1997-lab.github.io/Hakoniwa/index.html',more:'https://umikuri1997-lab.github.io/Hakoniwa/about.html'},
];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* 音：その場で作る。はじめは消しておく */
let AC=null,SND=false;try{SND=localStorage.getItem('gamebako-snd')==='1'}catch(e){}
const sndBtn=document.getElementById('snd');sndBtn.setAttribute('aria-pressed',SND);
function note(f,dur,{type='sine',vol=.16,when=0,to=null}={}){if(!SND)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.05)}catch(e){}}
function bell(f,when=0,vol=.12){note(f,1.2,{vol,when});note(f*2.01,.6,{vol:vol*.35,when});note(f*3.02,.3,{vol:vol*.15,when})}
const S={open:()=>{note(140,.35,{type:'triangle',vol:.12,to:90});[659,784,988,1319,1175,1568].forEach((f,i)=>bell(f,.25+i*.13))},close:()=>note(180,.25,{type:'triangle',vol:.14,to:110}),
  pop:()=>note(420,.16,{vol:.18,to:980}),shake:()=>{for(let i=0;i<4;i++)note(240-i*15,.07,{type:'triangle',vol:.09,when:i*.09})},boing:()=>note(170,.32,{vol:.2,to:560}),tap:()=>bell(1319,0,.08)};
const sfx=k=>S[k]&&S[k]();
sndBtn.onclick=()=>{SND=!SND;sndBtn.setAttribute('aria-pressed',SND);try{localStorage.setItem('gamebako-snd',SND?'1':'0')}catch(e){}if(SND)S.tap()};

/* タイトル */
const ttl=document.getElementById('ttl'),SCALE=[1047,1175,1319,1397,1568,1760,1976,2093,2349,2637];
[...'うみくりのゲームばこ'].forEach((ch,i)=>{const s=document.createElement('span');s.textContent=ch;s.setAttribute('aria-hidden','true');if(i===4)s.className='ac';
  s.addEventListener('click',()=>{s.classList.remove('hop');void s.offsetWidth;s.classList.add('hop');bell(SCALE[i]/2,0,.1)});ttl.appendChild(s)});

/* 紹介 */
const dlg=document.getElementById('dlg');let galT=null;
function openGame(g){const gal=document.getElementById('gal'),dots=document.getElementById('dots');gal.querySelectorAll('img').forEach(i=>i.remove());dots.innerHTML='';
  const ims=g.shots.map((src,i)=>{const im=new Image();im.src=src;im.alt=i?'':g.alt;im.width=1280;im.height=720;gal.insertBefore(im,dots);
    const d=document.createElement('button');d.setAttribute('aria-label',(i+1)+'まいめ');d.onclick=()=>show(i,true);dots.appendChild(d);return im});
  let cur=0;function show(i,user){ims[cur].classList.remove('on');dots.children[cur].removeAttribute('aria-current');cur=i;ims[cur].classList.add('on');dots.children[cur].setAttribute('aria-current','true');if(user){S.tap();clearInterval(galT)}}
  show(0);clearInterval(galT);if(!reduce&&ims.length>1)galT=setInterval(()=>show((cur+1)%ims.length),2600);
  document.getElementById('dName').textContent=g.name;document.getElementById('dTag').textContent=g.tag;document.getElementById('dDesc').textContent=g.desc;
  document.getElementById('dPlay').href=g.play;const m=document.getElementById('dMore');if(g.more){m.href=g.more;m.hidden=false}else m.hidden=true;dlg.showModal()}
dlg.addEventListener('close',()=>clearInterval(galT));
document.getElementById('dlgX').onclick=()=>{S.tap();dlg.close()};
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});

/* プレゼントの吹き出し */
const bub=document.getElementById('bubble');let bubT=null;
function say(text,x,y){bub.textContent=text;bub.style.left=x+'px';bub.style.top=y+'px';bub.classList.add('on');clearTimeout(bubT);bubT=setTimeout(()=>bub.classList.remove('on'),1700)}

/* いちらん */
{const L=document.getElementById('list');
 GAMES.forEach(g=>{const li=document.createElement('li');li.className='card';
   li.innerHTML=`<img src="${g.shots[0]}" alt="" width="1280" height="720" loading="lazy"><div class="bd"><h3></h3><p class="tg"></p><p></p><div class="btns"><a class="btn play">あそぶ</a><a class="btn more">しょうかい</a></div></div>`;
   li.querySelector('img').alt=g.alt;li.querySelector('h3').textContent=g.name;li.querySelector('.tg').textContent=g.tag;li.querySelectorAll('p')[1].textContent=g.desc;
   li.querySelector('.play').href=g.play;const m=li.querySelector('.more');if(g.more)m.href=g.more;else m.remove();L.appendChild(li)});
 const s=document.createElement('li');s.className='soon';s.textContent='つぎのゲームを、じゅんびちゅう';L.appendChild(s)}

/* 3Dの部屋 */
const hero=document.getElementById('hero'),ld=document.getElementById('loading');
startScene({canvas:document.getElementById('cv'),games:GAMES,onGame:openGame,onSay:say,sfx,reduce})
  .then(()=>hero.classList.add('ready'))
  .catch(e=>{console.error(e);ld.classList.add('err');ld.textContent='おもちゃ箱をひらけませんでした。下のいちらんから遊べます。'});
</script>
</body>
</html>
