<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>うみくりのゲームばこ</title>
<meta name="description" content="うみくりが作ったゲームをつめこんだ、おもちゃ箱。ブラウザですぐ遊べます。">
<meta property="og:title" content="うみくりのゲームばこ">
<meta property="og:description" content="うみくりが作ったゲームをつめこんだ、おもちゃ箱。ブラウザですぐ遊べます。">
<meta property="og:type" content="website">
<meta property="og:image" content="https://umikuri1997-lab.github.io/umikuri-lab.github.io/img/hakoniwa.webp">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
/* 絵本のおもちゃ箱：日だまりの部屋に、木の箱。ふたが奥へひらき、中のゲームが顔を出す。
   箱は CSS の3D（前・うしろ・底・ふち・ふた）。木目と紙は ambientCG の CC0 テクスチャ。 */
:root{
  --wall:#f4e6c8; --wall-d:#e5cfa3;
  --ink:#4b3523; --muted:#7c6249; --cream:#fff8ea;
  --wood-tint:rgba(150,86,38,.30); --brass:#d9a845; --brass-d:#9a6c1c;
  --red:#d9604f; --blue:#5f9fcf; --yellow:#efc35a; --green:#78b267; --pink:#ec9ab3;
  --spring:cubic-bezier(.34,1.56,.64,1); --soft:cubic-bezier(.22,1,.36,1);
  /* 箱の大きさ（px）。スマホでは、まるごと縮める（--s） */
  --W:720px; --D:250px; --H:200px; --t:18px; --s:1;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:500;line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden;background:#b88452}
button{font:inherit;color:inherit}
img{display:block;max-width:100%;height:auto}

/* ── 部屋 ── */
.room{position:relative;height:max(100svh,700px);overflow:hidden;isolation:isolate}
.wall{position:absolute;inset:0 0 26% 0;z-index:-3;
  background:
    radial-gradient(ellipse at 30% 10%,rgba(255,244,214,.9),rgba(255,244,214,0) 60%),
    radial-gradient(circle at 12px 12px,rgba(201,150,95,.16) 2.4px,transparent 3px) 0 0/48px 48px,
    radial-gradient(circle at 36px 36px,rgba(201,150,95,.10) 2px,transparent 2.6px) 0 0/48px 48px,
    url(img/paper.webp) 0 0/512px,
    linear-gradient(180deg,var(--wall),var(--wall-d));
  background-blend-mode:normal,normal,normal,multiply,normal}
.wall::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(180deg,#a8703f,#8a5a30);box-shadow:0 -4px 0 rgba(255,255,255,.25) inset,0 6px 14px rgba(70,40,15,.35)}
.floor{position:absolute;left:0;right:0;bottom:0;height:26%;z-index:-3;
  background:linear-gradient(180deg,rgba(60,30,10,.35),rgba(60,30,10,0) 40%),url(img/wood.webp) 0 0/260px;
  background-color:#b88452;background-blend-mode:normal,multiply}
.floor::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,220,160,.0),rgba(255,220,160,.18));mix-blend-mode:screen}
.vignette{position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(70,40,15,.28) 100%)}

/* まど と 光 */
.window{position:absolute;left:5%;top:20%;width:min(190px,22vw);aspect-ratio:3/4;z-index:-2;border:12px solid #c99560;border-radius:110px 110px 6px 6px;
  background:linear-gradient(180deg,#bfe3f5 0%,#e8f5f7 60%,#f9efd2 100%);box-shadow:0 8px 0 #a8703f,0 14px 24px rgba(90,55,20,.25),inset 0 0 0 4px rgba(255,255,255,.5)}
.window::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:10px;margin-left:-5px;background:#c99560}
.window::after{content:"";position:absolute;left:0;right:0;top:52%;height:10px;background:#c99560}
.window .cloud{position:absolute;width:60px;height:20px;border-radius:20px;background:#fff;top:26%;left:-30%;filter:blur(.5px);animation:cloud 26s linear infinite}
.window .cloud::before{content:"";position:absolute;width:28px;height:28px;border-radius:50%;background:#fff;left:12px;top:-12px}
@keyframes cloud{to{left:110%}}
.beam{position:absolute;left:3%;top:19%;width:62%;height:96%;z-index:-1;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,236,190,.55) 0%,rgba(255,236,190,.18) 45%,rgba(255,236,190,0) 70%);
  clip-path:polygon(4% 0,30% 0,100% 100%,40% 100%);filter:blur(10px);mix-blend-mode:screen;animation:beam 7s ease-in-out infinite alternate}
@keyframes beam{from{opacity:.75}to{opacity:1}}
#dust{position:absolute;inset:0;z-index:4;pointer-events:none}

/* かべのかざり：ガーランド */
.garland{position:absolute;left:30%;right:6%;top:4%;height:70px;z-index:-2}
.garland svg{width:100%;height:100%;overflow:visible}

/* ── タイトル ── */
.title{position:relative;z-index:6;text-align:center;padding:clamp(70px,13vh,120px) 16px 0}
.title h1{margin:0;font-weight:900;font-size:clamp(34px,7.4vw,66px);letter-spacing:.06em;line-height:1.15;color:#6a4322;
  -webkit-text-stroke:10px var(--cream);paint-order:stroke fill;text-shadow:0 6px 0 rgba(120,75,35,.25),0 14px 24px rgba(120,75,35,.18);user-select:none}
.title h1 span{display:inline-block;cursor:pointer;transition:transform .35s var(--spring)}
.title h1 span:hover{transform:translateY(-6px) rotate(-4deg)}
.title h1 span.hop{animation:hop .55s var(--spring)}
.title h1 .ac{color:var(--red)}
@keyframes hop{0%{transform:none}35%{transform:translateY(-18px) scale(1.1,.92)}70%{transform:translateY(2px) scale(.96,1.04)}100%{transform:none}}
.title p{margin:8px 0 0;font-family:"Klee One",serif;font-weight:600;font-size:clamp(15px,2.4vw,19px);color:var(--muted)}

/* ── 箱（3D） ── */
.stage{position:absolute;left:0;right:0;bottom:9%;z-index:3;height:0}
.stage-in{position:absolute;left:50%;bottom:0;width:var(--W);height:calc(var(--H) + 320px);margin-left:calc(var(--W) / -2);transform:scale(var(--s));transform-origin:50% 100%;perspective:1600px;perspective-origin:50% -40%}
.shadow{position:absolute;left:4%;right:4%;bottom:-26px;height:70px;border-radius:50%;background:radial-gradient(ellipse,rgba(60,30,10,.5),rgba(60,30,10,0) 70%);filter:blur(4px)}
.chest{position:absolute;left:0;bottom:0;width:var(--W);height:var(--H);transform-style:preserve-3d;transform:translateZ(calc(var(--D) / -2))}
.chest .f{position:absolute;backface-visibility:hidden}
.wood{background:linear-gradient(var(--wood-tint),var(--wood-tint)),url(img/wood.webp) 0 0/300px;background-blend-mode:multiply}
/* 前の板 */
.front{left:0;top:0;width:var(--W);height:var(--H);transform:translateZ(calc(var(--D) / 2));border-radius:4px;
  box-shadow:inset 0 -18px 30px rgba(60,30,10,.35),inset 0 10px 0 rgba(255,230,190,.25),inset 0 -6px 0 rgba(60,30,10,.4)}
.front::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 68px,rgba(60,30,10,.35) 68px 70px,rgba(255,220,170,.18) 70px 72px);border-radius:inherit}
/* 金具（四すみ） */
.brk{position:absolute;width:46px;height:46px;background:radial-gradient(circle at 30% 30%,#f6dc8e,var(--brass) 45%,var(--brass-d));box-shadow:0 2px 3px rgba(60,30,10,.45)}
.brk.tl{left:-4px;top:-4px;border-radius:4px 0 30px 0}.brk.tr{right:-4px;top:-4px;border-radius:0 4px 0 30px}
.brk.bl{left:-4px;bottom:-4px;border-radius:0 30px 0 4px}.brk.br{right:-4px;bottom:-4px;border-radius:30px 0 4px 0}
.brk::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:#8a5d16;box-shadow:inset 1px 1px 0 rgba(255,255,255,.4);left:12px;top:12px}
.brk.tr::after,.brk.br::after{left:auto;right:12px}.brk.bl::after,.brk.br::after{top:auto;bottom:12px}
/* 名札 */
.plate{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-1.2deg);padding:10px 34px 12px;background:url(img/paper.webp) 0 0/300px,var(--cream);background-blend-mode:multiply;
  border-radius:6px;box-shadow:0 0 0 4px var(--brass),0 0 0 7px var(--brass-d),0 8px 14px rgba(40,20,5,.45);font-weight:900;font-size:26px;letter-spacing:.14em;color:#6a4322;white-space:nowrap}
.plate::before,.plate::after{content:"";position:absolute;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--brass-d)}
.plate::before{left:10px}.plate::after{right:10px}
/* うしろ・底・ふち */
.back{left:0;top:0;width:var(--W);height:var(--H);transform:translateZ(calc(var(--D) / -2));filter:brightness(.6)}
.bottom{left:0;top:calc(var(--H) - var(--D) / 2);width:var(--W);height:var(--D);transform:rotateX(90deg);filter:brightness(.35)}
.rim{left:0;width:var(--W);height:var(--t);top:calc(var(--t) / -2);filter:brightness(1.12)}
.rim.fr{transform:translateZ(calc(var(--D) / 2 - var(--t) / 2)) rotateX(90deg)}
.rim.bk{transform:translateZ(calc(var(--D) / -2 + var(--t) / 2)) rotateX(90deg)}
.side{top:calc(var(--H) / 2 - var(--D) / 2);height:var(--t);width:var(--D)}
/* ふた（うしろのふちを ちょうつがい に、奥へひらく） */
.lid{position:absolute;left:-8px;width:calc(var(--W) + 16px);height:calc(var(--D) + 16px);top:calc(var(--D) * -1 - 16px);transform-style:preserve-3d;transform-origin:50% 100%;
  transform:translateZ(calc(var(--D) / -2)) rotateX(-90deg);transition:transform 1.3s var(--spring);cursor:pointer;border:0;padding:0;background:none}
.open .lid{transform:translateZ(calc(var(--D) / -2)) rotateX(14deg)}
.lid .in,.lid .out{position:absolute;inset:0;backface-visibility:hidden;border-radius:6px}
.lid .in{filter:brightness(.78) saturate(.9);box-shadow:inset 0 0 50px rgba(40,20,5,.45)}
.lid .out{transform:rotateX(180deg);box-shadow:inset 0 0 0 10px rgba(255,220,170,.15),inset 0 -40px 60px rgba(60,30,10,.25)}
.lid .out::before{content:"";position:absolute;left:12%;right:12%;top:0;bottom:0;border-left:22px solid var(--brass);border-right:22px solid var(--brass);opacity:.95;filter:drop-shadow(0 2px 2px rgba(60,30,10,.4))}
.lid .edge{position:absolute;left:0;right:0;top:0;height:30px;transform-origin:50% 0;transform:rotateX(90deg);filter:brightness(.9);box-shadow:inset 0 -4px 0 rgba(60,30,10,.4)}
.lid .say{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotateX(180deg);backface-visibility:hidden;font-family:"Klee One",serif;font-size:42px;color:#fff1d2;text-shadow:0 2px 0 rgba(60,30,10,.7),0 0 18px rgba(255,220,150,.45);pointer-events:none;white-space:nowrap}

/* ふたの うらの はり紙とシール */
.lid .note{position:absolute;left:8%;top:14%;transform:rotate(-6deg);backface-visibility:hidden;background:url(img/paper.webp) 0 0/300px,#fff6e2;background-blend-mode:multiply;padding:10px 18px;font-family:"Klee One",serif;font-size:20px;line-height:1.4;color:#6a4322;box-shadow:0 4px 8px rgba(30,15,5,.35);pointer-events:none}
.lid .note::before{content:"";position:absolute;left:50%;top:-10px;width:60px;height:20px;margin-left:-30px;background:rgba(236,154,179,.7);transform:rotate(3deg)}
.lid .stk{position:absolute;backface-visibility:hidden;width:44px;height:44px;pointer-events:none;background:var(--yellow);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.lid .s1{right:12%;top:12%;transform:rotate(12deg)}
.lid .s2{right:22%;top:30%;width:30px;height:30px;background:var(--pink);transform:rotate(-14deg)}
.lid .s3{left:34%;top:10%;width:26px;height:26px;background:var(--blue);border-radius:50%;clip-path:none}

/* ── 箱の中身 ── */
.item{position:absolute;bottom:var(--b,20px);opacity:0;transform-style:preserve-3d;transition:transform .9s var(--spring),opacity .2s linear .3s;transform:translate3d(0,var(--h0,260px),var(--z,0px)) rotateY(var(--ry,0deg)) rotateZ(var(--rz,0deg))}
.chest:not(.open) .item{pointer-events:none}
.open .item{opacity:1;transform:translate3d(0,0,var(--z,0px)) rotateY(var(--ry,0deg)) rotateZ(var(--rz,0deg));transition-delay:var(--d,.6s)}
.item>button{display:block;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:transform .35s var(--spring)}
.item>button:hover,.item>button:focus-visible{transform:translateY(-22px) rotateZ(calc(var(--rz,0deg) * -.6))}
.item>button:focus-visible{outline:4px solid var(--yellow);outline-offset:8px}

/* ゲームのパッケージ（厚みのある箱） */
.pkg{--pw:300px;--ph:380px;--pd:38px;width:var(--pw);height:var(--ph);position:relative;transform-style:preserve-3d}
.pkg .cv,.pkg .sp,.pkg .tp{position:absolute;backface-visibility:hidden}
.pkg .cv{inset:0;transform:translateZ(calc(var(--pd) / 2));border-radius:6px;overflow:hidden;background:#fbf1dc;box-shadow:inset 0 0 0 3px rgba(255,255,255,.4)}
.pkg .cv img{width:100%;height:62%;object-fit:cover;object-position:50% 40%}
.pkg .cv .nm{display:block;text-align:center;font-weight:900;font-size:30px;line-height:1.2;margin-top:10px;color:#5a3a1e;letter-spacing:.04em}
.pkg .cv .tg{display:block;text-align:center;font-family:"Klee One",serif;font-size:15px;color:var(--muted);margin-top:4px}
.pkg .cv::after{content:"";position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,0) 30%,rgba(255,255,255,0) 70%,rgba(255,255,255,.15) 100%);pointer-events:none}
.pkg .badge{position:absolute;left:-10px;top:12px;transform:rotate(-10deg);background:var(--red);color:#fff;font-weight:900;font-size:16px;letter-spacing:.1em;padding:6px 14px;border-radius:30px;box-shadow:0 4px 0 #a8443a,0 8px 12px rgba(0,0,0,.2)}
.pkg .sp{top:0;left:calc(var(--pw) - var(--pd) / 2);width:var(--pd);height:var(--ph);transform:rotateY(90deg);background:linear-gradient(90deg,#c8553f,#e0715a);border-radius:2px}
.pkg .sp::after{content:"はこにわ暮らし";position:absolute;inset:0;writing-mode:vertical-rl;display:grid;place-items:center;color:#fff;font-weight:900;font-size:16px;letter-spacing:.3em}
.pkg .tp{left:0;top:calc(var(--pd) / -2);width:var(--pw);height:var(--pd);transform:rotateX(90deg);background:#e9d7b5}

/* ないしょの箱（小さなプレゼント） */
.gift{--g:92px;width:var(--g);height:var(--g);position:relative;transform-style:preserve-3d}
.gift .gf{position:absolute;inset:0;transform:translateZ(calc(var(--g) / 2));border-radius:4px;background:var(--c);
  background-image:radial-gradient(circle,rgba(255,255,255,.35) 2.5px,transparent 3px);background-size:16px 16px;box-shadow:inset 0 -14px 18px rgba(0,0,0,.15)}
.gift .gf::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:16px;margin-left:-8px;background:linear-gradient(90deg,#fff6e0,#f3dfb2)}
.gift .gt{position:absolute;left:0;top:calc(var(--g) / -2);width:var(--g);height:var(--g);transform:rotateX(90deg);background:var(--c);filter:brightness(1.12)}
.gift .bow{position:absolute;left:50%;top:-30px;width:70px;height:40px;margin-left:-35px;transform:translateZ(calc(var(--g) / 2))}
.gift .q{position:absolute;inset:0;display:grid;place-items:center;transform:translateZ(calc(var(--g) / 2 + 1px));font-weight:900;font-size:30px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.gift.shake{animation:shake .55s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:rotateZ(-10deg)}40%{transform:rotateZ(8deg)}60%{transform:rotateZ(-6deg)}80%{transform:rotateZ(3deg)}}
.bubble{position:absolute;left:50%;bottom:calc(100% + 40px);transform:translateX(-50%) scale(.5);opacity:0;white-space:nowrap;background:var(--cream);border-radius:20px;padding:6px 16px;font-family:"Klee One",serif;font-size:17px;box-shadow:0 4px 0 rgba(120,75,35,.25);transition:transform .35s var(--spring),opacity .2s;pointer-events:none}
.bubble::after{content:"";position:absolute;left:50%;top:100%;margin-left:-8px;border:8px solid transparent;border-top-color:var(--cream)}
.talk .bubble{opacity:1;transform:translateX(-50%) scale(1)}

/* おもちゃ（ボール・つみき） */
.ball{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.75),rgba(255,255,255,0) 30%),conic-gradient(var(--red) 0 25%,#fff4df 0 50%,var(--blue) 0 75%,#fff4df 0);box-shadow:inset -10px -12px 20px rgba(0,0,0,.22)}
.blocks{display:flex;align-items:flex-end;gap:4px}
.blk{width:58px;height:58px;border-radius:6px;display:grid;place-items:center;font-weight:900;font-size:28px;color:#fff;background:var(--c);box-shadow:inset 0 -8px 0 rgba(0,0,0,.15),inset 0 6px 0 rgba(255,255,255,.25);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.blk:nth-child(2){transform:translateY(-58px) rotate(8deg);margin-left:-40px}
.boing{animation:boing .75s var(--spring)}
@keyframes boing{0%{transform:none}30%{transform:translateY(-70px) rotate(-14deg)}60%{transform:translateY(0) scale(1.12,.88)}80%{transform:scale(.96,1.04)}100%{transform:none}}

/* ── 紙ふぶき ── */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;width:9px;height:13px;border-radius:2px;background:var(--c);animation:fall var(--tt) cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--x),var(--y)) rotate(var(--rot));opacity:0}}

/* ── 下：ゲームのいちらん（絵本のページ） ── */
.book{position:relative;background:url(img/paper.webp) 0 0/400px,#fbf2df;background-blend-mode:multiply;padding:56px 16px 40px;border-top:8px solid #8a5a30;box-shadow:0 -10px 30px rgba(60,30,10,.3)}
.book h2{text-align:center;margin:0 0 26px;font-family:"Klee One",serif;font-size:26px;color:#6a4322}
.book h2::before,.book h2::after{content:"";display:inline-block;width:40px;height:2px;background:#c9a46e;vertical-align:middle;margin:0 14px}
.list{max-width:880px;margin:0 auto;display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));list-style:none;padding:0}
.card{background:#fffaf0;border-radius:10px;overflow:hidden;box-shadow:0 2px 0 #e3cfa8,0 10px 24px rgba(120,75,35,.16);transition:transform .3s var(--soft),box-shadow .3s}
.card:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 2px 0 #e3cfa8,0 18px 30px rgba(120,75,35,.22)}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover}
.card .bd{padding:14px 18px 18px}
.card h3{margin:0;font-size:21px;font-weight:900}
.card .tg{margin:0 0 6px;font-family:"Klee One",serif;color:var(--muted);font-size:14px}
.card p{margin:0 0 14px;font-size:15px}
.soon{display:grid;place-items:center;min-height:200px;border:3px dashed #d8bf95;border-radius:10px;color:var(--muted);font-family:"Klee One",serif;font-size:17px;text-align:center;padding:20px}
footer{background:#fbf2df;color:var(--muted);text-align:center;font-size:13px;padding:10px 16px 26px}

/* ボタン */
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:10px 26px;border-radius:40px;font-weight:900;font-size:16px;letter-spacing:.1em;text-decoration:none;transition:transform .12s var(--soft),box-shadow .12s}
.btn.play{background:var(--red);color:#fff;box-shadow:0 5px 0 #a8443a,0 8px 14px rgba(168,68,58,.3)}
.btn.more{background:#fff4df;color:#6a4322;box-shadow:0 5px 0 #d8bf95}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a8443a}
.btn:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

/* 音のボタン */
.snd{position:fixed;top:14px;right:14px;z-index:30;width:50px;height:50px;border-radius:50%;border:0;background:var(--cream);box-shadow:0 4px 0 #d8bf95,0 8px 16px rgba(120,75,35,.2);cursor:pointer;display:grid;place-items:center;transition:transform .12s var(--soft)}
.snd:active{transform:translateY(3px)}
.snd:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.snd svg{width:26px;height:26px}
.snd .on{display:none}.snd[aria-pressed="true"] .on{display:block}.snd[aria-pressed="true"] .off{display:none}

/* ── ゲームの紹介（ポップアップ） ── */
dialog{border:0;padding:0;background:none;max-width:min(620px,calc(100% - 32px));width:100%;overflow:visible}
dialog::backdrop{background:rgba(60,35,15,.5);backdrop-filter:blur(3px)}
dialog[open] .pop{animation:popin .5s var(--spring)}
@keyframes popin{0%{transform:scale(.75) translateY(40px) rotate(-2deg);opacity:0}100%{transform:none;opacity:1}}
.pop{background:url(img/paper.webp) 0 0/400px,#fffaf0;background-blend-mode:multiply;border-radius:14px;box-shadow:0 20px 50px rgba(40,20,5,.4);position:relative;overflow:hidden}
.gal{position:relative;aspect-ratio:16/9;background:#e9d7b5}
.gal img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease}
.gal img.on{opacity:1}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:8px}
.dots button{width:12px;height:12px;border-radius:50%;border:2px solid #fff;background:rgba(255,255,255,.35);padding:0;cursor:pointer}
.dots button[aria-current="true"]{background:#fff}
.pop .bd{padding:16px 22px 22px}
.pop h2{margin:0;font-size:26px;font-weight:900}
.pop .tg{margin:0 0 8px;color:var(--muted);font-family:"Klee One",serif;font-size:15px}
.pop .ds{margin:0 0 18px}
.pop .x{position:absolute;top:10px;right:10px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,250,240,.92);cursor:pointer;font-size:22px;font-weight:900;line-height:1;box-shadow:0 3px 8px rgba(0,0,0,.2);z-index:2}
.pop .x:focus-visible{outline:3px solid var(--yellow)}

@media (max-width:640px){
  .title h1{font-size:8.2vw;letter-spacing:0;-webkit-text-stroke:7px var(--cream)}
  .window{left:4%;top:24%;border-width:8px}
  .garland{left:38%;right:3%}
  .stage{margin-top:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
}
</style>
</head>
<body>

<button class="snd" id="snd" aria-pressed="false" aria-label="音">
  <svg class="off" viewBox="0 0 24 24" fill="none" stroke="#6a4322" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>
  <svg class="on" viewBox="0 0 24 24" fill="none" stroke="#6a4322" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
</button>

<div class="room" id="room">
  <div class="wall"></div>
  <div class="floor"></div>
  <div class="window" aria-hidden="true"><span class="cloud"></span></div>
  <div class="beam" aria-hidden="true"></div>
  <div class="garland" aria-hidden="true">
    <svg viewBox="0 0 600 70" preserveAspectRatio="none">
      <path d="M0 6 Q300 70 600 6" fill="none" stroke="#a8703f" stroke-width="2"/>
      <g id="flags"></g>
    </svg>
  </div>
  <canvas id="dust" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <header class="title">
    <h1 id="ttl" aria-label="うみくりのゲームばこ"></h1>
    <p>ふたをあけて、すきなゲームをえらんでね</p>
  </header>

  <div class="stage" id="stage">
    <div class="stage-in">
      <div class="shadow"></div>
      <div class="chest" id="chest">
        <div class="f back wood"></div>
        <div class="f bottom wood"></div>
        <div class="f rim bk wood"></div>
        <button class="lid" id="lid" aria-label="ふたをあける"><span class="in wood"></span><span class="out wood"></span><span class="edge wood"></span><span class="say">あけてみて</span><span class="note">たいせつな<br>ゲームたち</span><span class="stk s1"></span><span class="stk s2"></span><span class="stk s3"></span></button>

        <div class="item" style="left:240px;--z:-30px;--rz:-3deg;--ry:-14deg;--d:.55s;--h0:420px;--b:40px">
          <button id="pkgBtn" aria-label="はこにわ暮らし">
            <div class="pkg">
              <div class="tp"></div><div class="sp"></div>
              <div class="cv"><img src="img/hakoniwa.webp" alt="" width="1280" height="720"><span class="nm">はこにわ暮らし</span><span class="tg">守り神とせいれいのものがたり</span><span class="badge">あそべる</span></div>
            </div>
          </button>
        </div>
        <div class="item" style="left:60px;--z:30px;--rz:6deg;--d:.75s;--b:175px">
          <button class="toy" aria-label="つみき"><div class="blocks"><span class="blk" style="--c:var(--yellow)">う</span><span class="blk" style="--c:var(--green)">み</span></div></button>
        </div>
        <div class="item" style="left:570px;--z:10px;--rz:-8deg;--ry:-20deg;--d:.85s;--b:150px">
          <button class="gift" data-say="まだ ないしょ" aria-label="まだないしょの箱" style="--c:var(--blue)"><span class="gt"></span><span class="gf"></span><span class="q">?</span><svg class="bow" viewBox="0 0 70 40" aria-hidden="true"><path d="M35 30C20 10 4 6 6 20s18 12 29 10zM35 30c15-20 31-24 29-10S46 32 35 30z" fill="#fff4df" stroke="#d8bf95" stroke-width="2"/><circle cx="35" cy="29" r="6" fill="#f3dfb2"/></svg><span class="bubble"></span></button>
        </div>
        <div class="item" style="left:480px;--z:60px;--rz:5deg;--ry:12deg;--d:.95s;--b:160px">
          <button class="gift" data-say="じゅんびちゅう" aria-label="まだないしょの箱" style="--c:var(--pink);--g:74px"><span class="gt"></span><span class="gf"></span><span class="q">?</span><svg class="bow" viewBox="0 0 70 40" aria-hidden="true"><path d="M35 30C20 10 4 6 6 20s18 12 29 10zM35 30c15-20 31-24 29-10S46 32 35 30z" fill="#fff4df" stroke="#d8bf95" stroke-width="2"/><circle cx="35" cy="29" r="6" fill="#f3dfb2"/></svg><span class="bubble"></span></button>
        </div>
        <div class="item" style="left:150px;--z:80px;--d:1.05s;--b:165px">
          <button class="toy" aria-label="ボール"><div class="ball"></div></button>
        </div>

        <div class="f rim fr wood"></div>
        <div class="f front wood"><span class="brk tl"></span><span class="brk tr"></span><span class="brk bl"></span><span class="brk br"></span><span class="plate">うみくりのゲームばこ</span></div>
      </div>
    </div>
  </div>
</div>

<section class="book">
  <h2>ゲームのいちらん</h2>
  <!-- ゲームを足すときは、GAMES（下のプログラム）に1つ足す。絵は img/ に入れる -->
  <ul class="list" id="list"></ul>
</section>
<footer>うみくりのゲームばこ</footer>

<dialog id="dlg" aria-labelledby="dName">
  <div class="pop">
    <button class="x" id="dlgX" aria-label="とじる">×</button>
    <div class="gal" id="gal"><div class="dots" id="dots"></div></div>
    <div class="bd">
      <h2 id="dName"></h2>
      <p class="tg" id="dTag"></p>
      <p class="ds" id="dDesc"></p>
      <div class="btns"><a class="btn play" id="dPlay" href="#">あそぶ</a><a class="btn more" id="dMore" href="#">しょうかい</a></div>
    </div>
  </div>
</dialog>

<div class="confetti" id="conf" aria-hidden="true"></div>

<script>
/* ゲームの一覧。ふやすときは、ここに1つ足す（shots は紹介で切りかわる絵） */
const GAMES=[
  {name:'はこにわ暮らし',tag:'村づくり・スマホ／パソコン',
   shots:['img/hakoniwa.webp','img/hakoniwa-kazan.webp','img/hakoniwa-tani.webp','img/hakoniwa-mizube.webp','img/hakoniwa-sora.webp'],
   alt:'はこにわ暮らしの画面',
   desc:'荒れた土地をまもる守り神になって、ちいさなせいれいたちと村をつくる。夜はこわいものから村を守りながら、土地ごとのお話をすすめよう。',
   play:'https://umikuri1997-lab.github.io/Hakoniwa/index.html',more:'https://umikuri1997-lab.github.io/Hakoniwa/about.html'},
];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ── 音：その場で作る。はじめは消しておく ── */
let AC=null,SND=false;try{SND=localStorage.getItem('gamebako-snd')==='1'}catch(e){}
const sndBtn=document.getElementById('snd');sndBtn.setAttribute('aria-pressed',SND);
function note(f,dur,{type='sine',vol=.16,when=0,to=null}={}){if(!SND)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.05)}catch(e){}}
function bell(f,when=0,vol=.12){note(f,1.2,{type:'sine',vol,when});note(f*2.01,.6,{type:'sine',vol:vol*.35,when});note(f*3.02,.3,{type:'sine',vol:vol*.15,when})}/* オルゴールの音 */
const S={
  open:()=>{note(140,.35,{type:'triangle',vol:.12,to:90});[659,784,988,1319,1175,1568].forEach((f,i)=>bell(f,.25+i*.13))},
  close:()=>note(180,.25,{type:'triangle',vol:.14,to:110}),
  pop:()=>note(420,.16,{vol:.18,to:980}),
  shake:()=>{for(let i=0;i<4;i++)note(240-i*15,.07,{type:'triangle',vol:.09,when:i*.09})},
  boing:()=>note(170,.32,{vol:.2,to:560}),
  tap:()=>bell(1319,0,.08),
};
sndBtn.onclick=()=>{SND=!SND;sndBtn.setAttribute('aria-pressed',SND);try{localStorage.setItem('gamebako-snd',SND?'1':'0')}catch(e){}if(SND)S.tap()};

/* ── タイトル ── */
const ttl=document.getElementById('ttl'),SCALE=[1047,1175,1319,1397,1568,1760,1976,2093,2349,2637];
[...'うみくりのゲームばこ'].forEach((ch,i)=>{const s=document.createElement('span');s.textContent=ch;s.setAttribute('aria-hidden','true');if(i===4)s.className='ac';
  s.addEventListener('click',()=>{s.classList.remove('hop');void s.offsetWidth;s.classList.add('hop');bell(SCALE[i]/2,0,.1)});ttl.appendChild(s)});

/* ガーランドの旗 */
{const g=document.getElementById('flags'),C=['#d9604f','#efc35a','#5f9fcf','#78b267','#ec9ab3'];
 for(let i=0;i<11;i++){const x=30+i*54,t=x/600,y=(1-t)*(1-t)*6+2*(1-t)*t*70+t*t*6;
   const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M${x-14} ${y-2}L${x+14} ${y-2}L${x} ${y+26}Z`);p.setAttribute('fill',C[i%5]);g.appendChild(p)}}

/* ── 箱の大きさ：はばに合わせて縮める ── */
function fit(){const room=document.getElementById('room'),w=Math.min(window.innerWidth,1100)-32,h=room.clientHeight*.62,s=Math.min(1,w/760,h/(200+330));document.documentElement.style.setProperty('--s',s.toFixed(3))}
fit();addEventListener('resize',fit);

/* ── ふた ── */
const chest=document.getElementById('chest'),lid=document.getElementById('lid');
function openBox(){chest.classList.add('open');lid.setAttribute('aria-label','ふたをしめる');S.open();if(!reduce)setTimeout(confetti,520)}
lid.onclick=()=>{if(chest.classList.contains('open')){chest.classList.remove('open');lid.setAttribute('aria-label','ふたをあける');S.close()}else openBox()};
setTimeout(openBox,reduce?0:900);

function confetti(){const c=document.getElementById('conf'),r=chest.getBoundingClientRect(),C=['#d9604f','#efc35a','#5f9fcf','#78b267','#ec9ab3','#fff4df'];
  for(let i=0;i<60;i++){const p=document.createElement('i'),a=-Math.PI/2+(Math.random()-.5)*2,v=200+Math.random()*320,x0=r.left+r.width*(.2+Math.random()*.6);
    p.style.cssText=`left:${x0}px;top:${r.top}px;--c:${C[i%C.length]};--x:${Math.cos(a)*v}px;--y:${Math.sin(a)*v+420}px;--rot:${Math.random()*900-450}deg;--tt:${1.4+Math.random()}s`;
    c.appendChild(p);setTimeout(()=>p.remove(),2600)}}

/* ── 中身 ── */
const dlg=document.getElementById('dlg');
document.getElementById('pkgBtn').onclick=()=>openGame(GAMES[0]);
document.querySelectorAll('.gift').forEach(b=>{b.querySelector('.bubble').textContent=b.dataset.say;
  b.onclick=()=>{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake','talk');S.shake();clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('talk'),1700)}});
document.querySelectorAll('.toy').forEach(b=>b.addEventListener('click',()=>{const k=b.firstElementChild;k.classList.remove('boing');void k.offsetWidth;k.classList.add('boing');S.boing()}));

/* ── ゲームの紹介 ── */
let galT=null;
function openGame(g){S.pop();
  const gal=document.getElementById('gal'),dots=document.getElementById('dots');gal.querySelectorAll('img').forEach(i=>i.remove());dots.innerHTML='';
  const ims=g.shots.map((src,i)=>{const im=new Image();im.src=src;im.alt=i?'':g.alt;im.width=1280;im.height=720;if(!i)im.className='on';gal.insertBefore(im,dots);
    const d=document.createElement('button');d.setAttribute('aria-label',(i+1)+'まいめ');d.onclick=()=>show(i,true);dots.appendChild(d);return im});
  let cur=0;function show(i,user){ims[cur].classList.remove('on');dots.children[cur].removeAttribute('aria-current');cur=i;ims[cur].classList.add('on');dots.children[cur].setAttribute('aria-current','true');if(user){S.tap();clearInterval(galT)}}
  show(0);clearInterval(galT);if(!reduce&&ims.length>1)galT=setInterval(()=>show((cur+1)%ims.length),2600);
  document.getElementById('dName').textContent=g.name;document.getElementById('dTag').textContent=g.tag;document.getElementById('dDesc').textContent=g.desc;
  document.getElementById('dPlay').href=g.play;const m=document.getElementById('dMore');if(g.more){m.href=g.more;m.hidden=false}else m.hidden=true;
  dlg.showModal()}
dlg.addEventListener('close',()=>clearInterval(galT));
document.getElementById('dlgX').onclick=()=>{S.tap();dlg.close()};
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});

/* ── いちらん ── */
{const L=document.getElementById('list');
 GAMES.forEach(g=>{const li=document.createElement('li');li.className='card';
   li.innerHTML=`<img src="${g.shots[0]}" alt="" width="1280" height="720" loading="lazy"><div class="bd"><h3></h3><p class="tg"></p><p></p><div class="btns"><a class="btn play">あそぶ</a><a class="btn more">しょうかい</a></div></div>`;
   li.querySelector('img').alt=g.alt;li.querySelector('h3').textContent=g.name;li.querySelector('.tg').textContent=g.tag;li.querySelectorAll('p')[1].textContent=g.desc;
   li.querySelector('.play').href=g.play;const m=li.querySelector('.more');if(g.more)m.href=g.more;else m.remove();L.appendChild(li)});
 const s=document.createElement('li');s.className='soon';s.textContent='つぎのゲームを、じゅんびちゅう';L.appendChild(s)}

/* ── 光の中のほこり ── */
(function(){const cv=document.getElementById('dust'),room=document.getElementById('room');if(reduce)return;const ctx=cv.getContext('2d');let W,H,P=[];
 function rs(){const d=Math.min(2,devicePixelRatio||1);W=room.clientWidth;H=room.clientHeight;cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0);
   P=Array.from({length:Math.round(W*H/16000)},()=>({x:Math.random()*W,y:Math.random()*H,r:.6+Math.random()*1.8,vx:(Math.random()-.3)*.12,vy:-.05-Math.random()*.12,p:Math.random()*6.28}))}
 rs();addEventListener('resize',rs);
 function inBeam(x,y){const t=y/H;return x>W*(.04+.26*t)-60&&x<W*(.04+.62*t*1.0)+W*.2}
 (function loop(){ctx.clearRect(0,0,W,H);for(const q of P){q.x+=q.vx;q.y+=q.vy;q.p+=.02;if(q.y<-5){q.y=H+5;q.x=Math.random()*W}if(q.x>W+5)q.x=-5;
   const a=inBeam(q.x,q.y)?.75:.18;ctx.globalAlpha=a*(.6+.4*Math.sin(q.p));ctx.fillStyle='#fff3d0';ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,6.28);ctx.fill()}
   requestAnimationFrame(loop)})()})();
</script>
</body>
</html>
